<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src https://media.openwall.local; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>OpenWall</title><link rel="stylesheet" href="app.css"><script defer src="app.js"></script></head>
<body><aside><div class="brand">◒ <span>OpenWall</span></div><p class="eyebrow">YOUR SPACE</p><nav id="nav"><button data-page="All wallpapers" class="active">▦ All wallpapers</button><button data-page="Motion collection">✧ Motion collection</button><button data-page="My videos">▻ My videos</button><button data-page="Playlist">☷ Playlist</button><button data-page="Settings">☷ Settings</button></nav><div class="aside-bottom"><span class="leaf">⌁</span><p>A little more life.<br>A space that's yours.</p><small>Free & open source · MIT<br>Windows Preview</small></div></aside>
<main><header><div><h1>Give your desktop a little life.</h1><p>Click a wallpaper to apply it. Build a playlist to keep it changing.</p></div><button id="import" class="primary">＋ Import videos</button></header><div id="content" aria-live="polite"></div><footer><div><span id="status">Loading your library…</span><small id="displayCount"></small></div><select id="target" aria-label="Apply to display"></select><button id="pause">Pause</button><button id="stop">Stop</button></footer></main><div id="notice" role="status" hidden></div></body></html>
